<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Task Manager</h1>
      <p class="sub">Create, update, delete and track your tasks</p>
    </header>

    <section class="stats" id="stats"></section>
    <div class="bar"><div id="bar-fill"></div></div>

    <section class="card">
      <h2 id="form-title">New task</h2>
      <div id="error" class="error" hidden></div>
      <form id="task-form" autocomplete="off">
        <input type="hidden" id="task-id">
        <input id="title" placeholder="Task title *" maxlength="150" required>
        <textarea id="description" rows="2" placeholder="Description (optional)"></textarea>
        <div class="row">
          <label>Priority
            <select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
          </label>
          <label>Status
            <select id="status"><option value="todo">To Do</option><option value="in_progress">In Progress</option><option value="done">Done</option></select>
          </label>
          <label>Due date <input type="date" id="due_date"></label>
        </div>
        <div class="row">
          <button type="submit" class="btn primary" id="save-btn">Add task</button>
          <button type="button" class="btn" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="toolbar">
      <div class="tabs" id="tabs">
        <button data-f="" class="active">All</button>
        <button data-f="todo">To Do</button>
        <button data-f="in_progress">In Progress</button>
        <button data-f="done">Done</button>
      </div>
      <input id="search" type="search" placeholder="Search tasks…">
    </section>

    <section id="list"></section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
